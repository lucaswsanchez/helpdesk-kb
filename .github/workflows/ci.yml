name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  powershell:
    name: PowerShell lint & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force
      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: ./tools/Invoke-CI.ps1 -Task Lint
      - name: Test (Pester, PowerShell 7)
        shell: pwsh
        run: ./tools/Invoke-CI.ps1 -Task Test
      - name: Install Pester for Windows PowerShell 5.1
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck
      - name: Test (Pester, Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Invoke-CI.ps1 -Task Test
      - name: Script docs are up to date
        shell: powershell
        run: ./tools/Build-ScriptDoc.ps1 -Check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testResults.xml
          if-no-files-found: ignore

  docs:
    name: Docs build & KB validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate KB front matter and structure
        run: python tools/validate_kb.py
      - name: Check KB index is up to date
        run: python tools/gen_kb_index.py --check
      - name: Unit tests (pytest)
        run: pytest -q
      - name: Build site (strict)
        run: mkdocs build --strict
