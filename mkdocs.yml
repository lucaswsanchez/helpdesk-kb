site_name: Acme Corp IT Service Desk
site_description: Self-service IT knowledge base, ITIL processes and a tested PowerShell support toolkit.
site_author: Lucas Sanchez
site_url: https://lucaswsanchez.github.io/helpdesk-kb/
repo_url: https://github.com/lucaswsanchez/helpdesk-kb
repo_name: lucaswsanchez/helpdesk-kb
edit_uri: edit/main/docs/
copyright: Acme Corp is a fictional company. Portfolio project by Lucas Sanchez &middot; MIT License

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lucaswsanchez
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/lucaswsanchez
      name: LinkedIn

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Knowledge Base:
      - kb/index.md
  - Processes:
      - processes/index.md
  - Ticket Cases:
      - tickets/index.md
  - Toolkit:
      - scripts/index.md
